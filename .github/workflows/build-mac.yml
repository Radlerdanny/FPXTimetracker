name: Build Mac

# Auslöser: jeder Tag der Form v1.2.3
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # für den Release-Upload nötig

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.14 installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Version aus Tag lesen
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install py2app pyobjc-framework-Cocoa requests

      - name: .app mit py2app bauen
        run: |
          source .venv/bin/activate
          python setup.py py2app

      - name: Release-ZIP erstellen
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          FOLDER="FPXTimetracker_Mac_v${V}"
          mkdir "$FOLDER"
          cp -R "dist/FPX Timetracker.app" "$FOLDER/"
          cp Installieren.command "$FOLDER/"
          chmod +x "$FOLDER/Installieren.command"
          zip -r "${FOLDER}.zip" "$FOLDER"

      - name: ZIP zu GitHub Release hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: "FPX Timetracker v${{ steps.ver.outputs.VERSION }}"
          generate_release_notes: true
          files: "FPXTimetracker_Mac_v${{ steps.ver.outputs.VERSION }}.zip"
