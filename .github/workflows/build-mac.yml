name: Build Mac

# Auslöser: jeder Tag der Form v1.2.3
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # für den Release-Upload nötig

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.14.3 installieren (offizieller python.org-Installer)
        run: |
          # WICHTIG: actions/setup-python installiert auf macOS einen Build aus dem
          # actions/python-versions-Repo, der Tcl/Tk 9.0 bündelt – sichtbar andere
          # Optik (größere Schrift, andere Buttons) als die bisher genutzte Tk-8.6-Basis.
          # Der offizielle python.org-Installer bündelt für 3.14.3 weiterhin Tcl/Tk 8.6.17,
          # exakt was wir brauchen. Deshalb hier bewusst NICHT actions/setup-python.
          curl -o python.pkg "https://www.python.org/ftp/python/3.14.3/python-3.14.3-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.14/bin" >> "$GITHUB_PATH"

      - name: Tcl/Tk-Version verifizieren (muss 8.6.x sein, nicht 9.x)
        run: |
          export PATH="/Library/Frameworks/Python.framework/Versions/3.14/bin:$PATH"
          python3 -c "
          import tkinter
          v = tkinter.TkVersion
          print(f'Tk-Version: {v}')
          assert v < 9.0, f'FALSCHE Tk-Version {v} – muss 8.6.x sein!'
          "

      - name: Version aus Tag lesen
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install py2app pyobjc-framework-Cocoa requests

      - name: .app mit py2app bauen (inkl. Ad-hoc-Signierung)
        run: |
          source .venv/bin/activate
          python setup.py py2app

      - name: App-Start verifizieren (Signatur + tatsächlicher Start)
        run: |
          APP="dist/FPX Timetracker.app"
          echo "── Codesign-Status ──"
          codesign -dv --verbose=4 "$APP"
          echo ""
          echo "── Starte App testweise ──"
          open "$APP"
          sleep 5
          if ! pgrep -f "FPX Timetracker" > /dev/null; then
            echo "::error::App wurde beendet/ist abgestürzt (SIGKILL/Code-Signature-Fehler?). Build abgebrochen."
            ls -lt ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5
            exit 1
          fi
          echo "✓ App läuft (PID gefunden)."
          pkill -f "FPX Timetracker" || true

      - name: Release-ZIP erstellen
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          FOLDER="FPXTimetracker_Mac_v${V}"
          mkdir "$FOLDER"
          cp -R "dist/FPX Timetracker.app" "$FOLDER/"
          # .scpt statt .command: öffnet sich im Skripteditor (Doppelklick + Play),
          # dadurch keine Gatekeeper-Warnung "Datei könnte gefährlich sein" bei
          # heruntergeladenen Dateien wie bei direkt ausführbaren .command-Skripten.
          osacompile -o "$FOLDER/Installieren.scpt" Installieren.applescript
          cp "LIES MICH.txt" "$FOLDER/"
          zip -r "${FOLDER}.zip" "$FOLDER"

      - name: ZIP zu GitHub Release hochladen
        uses: softprops/action-gh-release@v2
        with:
          name: "FPX Timetracker v${{ steps.ver.outputs.VERSION }}"
          generate_release_notes: true
          files: "FPXTimetracker_Mac_v${{ steps.ver.outputs.VERSION }}.zip"
