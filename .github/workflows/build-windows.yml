name: Build Windows

# Auslöser: jeder Tag der Form v1.2.3
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # für den Release-Upload nötig

defaults:
  run:
    shell: bash     # Git Bash auf Windows – konsistente Syntax

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.14 installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Tcl/Tk-Version verifizieren (muss 8.6.x sein, nicht 9.x)
        run: |
          python -c "
          import tkinter
          v = tkinter.TkVersion
          print(f'Tk-Version: {v}')
          assert v < 9.0, f'FALSCHE Tk-Version {v} – muss 8.6.x sein!'
          "

      - name: Version aus Tag lesen
        id: ver
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        run: |
          python -m venv .venv
          source .venv/Scripts/activate
          pip install --upgrade pip
          pip install pyinstaller requests pystray Pillow

      - name: .exe mit PyInstaller bauen
        run: |
          source .venv/Scripts/activate
          pyinstaller windows/fpx_installer.spec

      - name: App-Start verifizieren (tatsächlicher Start)
        shell: pwsh
        run: |
          $exe = "dist\FPX Timetracker\FPX Timetracker.exe"
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 5
          $proc = Get-Process -Name "FPX Timetracker" -ErrorAction SilentlyContinue
          if (-not $proc) {
            Write-Host "::error::App wurde beendet/ist abgestürzt. Build abgebrochen."
            exit 1
          }
          Write-Host "✓ App läuft (PID $($proc.Id))."
          Stop-Process -Name "FPX Timetracker" -Force -ErrorAction SilentlyContinue

      - name: Inno Setup installieren
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          # MSYS_NO_PATHCONV=1 verhindert, dass Git Bash /D... als Laufwerkspfad übersetzt
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DMyAppVersion=${V}" \
            "windows/fpx_installer.iss"

      - name: Installer zu GitHub Release hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/FPXTimetracker_Win_v${{ steps.ver.outputs.VERSION }}.exe"
